[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folios"
version = "0.1.0"
description = "A local, single-user portfolio tracker."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Theo Seguin" }]

dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "pydantic>=2.7,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "PyYAML>=6.0,<7.0",
    "requests>=2.31,<3.0",
    "tenacity>=8.2,<10.0",
    "python-dotenv>=1.0,<2.0",
    "yfinance>=1.5,<2.0",
    "curl_cffi>=0.15,<1.0",
    # stockdex is a real runtime dependency (folios.exposure imports it)
    # but is deliberately NOT listed here: its metadata pins
    # curl_cffi==0.12.0 exactly, which conflicts with yfinance's >=0.15
    # (verified working fine against 0.16.3 in practice — the pin is
    # just stale). It must be installed separately with --no-deps; see
    # requirements.txt and the `setup` target in Makefile, which do this.
    # A bare `pip install -e .` without that follow-up step leaves
    # `folios.exposure` (and anything importing it) unable to import.
]

[project.scripts]
folios = "folios.cli:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<1.0",
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
