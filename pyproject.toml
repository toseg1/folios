[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folio"
version = "0.1.0"
description = "A local, single-user portfolio tracker."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Theo Seguin" }]

dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "pydantic>=2.7,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "PyYAML>=6.0,<7.0",
    "requests>=2.31,<3.0",
    "tenacity>=8.2,<10.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
folio = "folio.cli:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<1.0",
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
