name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: folios_test
          POSTGRES_PASSWORD: folios_test
          POSTGRES_DB: folios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folios_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FOLIOS_TEST_DATABASE_URL: postgresql://folios_test:folios_test@localhost:5432/folios_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=folios
